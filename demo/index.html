<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>麦门抽卡模拟器 · Mcd-Gacha</title>
  <meta name="description" content="用二游抽卡机制决定「中午吃什么」：SSR/SR/R/N 四档稀有度 + 10 发硬保底，预算内组合优化。非官方开源玩具。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>🍟 麦门抽卡模拟器</h1>
      <p class="tagline">「中午不知道吃什么？把工位命运交给一顿预算内的单抽。」</p>
      <div class="hero-meta">
        <span class="chip">SSR/SR/R/N 四档稀有度</span>
        <span class="chip">10 发硬保底</span>
        <span class="chip">真实菜单快照</span>
      </div>
    </header>

    <nav class="banner-tabs" id="bannerTabs" aria-label="卡池选择"></nav>

    <div class="pity-row">
      <span class="pity-label">保底进度</span>
      <div class="pity-bar" id="pityBar"></div>
      <span class="pity-count" id="pityCount">0/10</span>
    </div>

    <main class="stage" id="stage">
      <!-- 待机卡背 -->
      <div class="card-slot" id="cardSlot">
        <div class="card-inner" id="cardInner">
          <div class="card-back" id="cardBack">
            <div class="card-back-logo">🥚</div>
            <div class="card-back-hint">按下方按钮开抽</div>
          </div>
          <div class="card-face" id="cardFace"></div>
        </div>
      </div>
      <div class="ten-grid" id="tenGrid"></div>
    </main>

    <div class="controls">
      <button class="btn btn-primary" id="pullBtn">🎰 单抽</button>
      <button class="btn" id="tenBtn">🎰 十连</button>
    </div>

    <div class="link-row">
      <a class="btn btn-ghost" id="starBtn" href="https://github.com/pzweuj/mcd-gacha" target="_blank" rel="noopener">⭐ Star on GitHub</a>
      <button class="btn btn-ghost" id="copyCmd">📋 复制安装命令</button>
    </div>

    <footer class="footer">
      <p>数据为 2026-10 菜单快照 · 价格与供应以麦当劳官方渠道为准</p>
      <p>非官方开源玩具 · 理性消费 · <a href="https://github.com/pzweuj/mcd-gacha" target="_blank" rel="noopener">Mcd-Gacha</a></p>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="ssr-banner" id="ssrBanner">★ 金 色 传 说 ★</div>

  <script type="module" src="app.js"></script>
</body>
</html>
