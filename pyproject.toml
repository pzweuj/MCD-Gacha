[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcd-gacha"
version = "0.1.0"
description = "麦门抽卡模拟器：用二游抽卡机制决定中午吃什么（麦当劳 MCP Server 驱动）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EuJ" }]
keywords = ["mcdonalds", "mcp", "gacha", "skill", "agent", "fun", "food"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 真实 MCP 模式所需（懒加载，未安装时 mock 模式依旧可用）
mcp = ["mcp>=2.3,<3"]
# SVG 转 PNG 分享卡所需
png = ["cairosvg>=2.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mcd-gacha = "mcd_gacha.cli:main"

[project.urls]
Homepage = "https://github.com/EuJ/MCD-Gacha"

[tool.hatch.build.targets.wheel]
packages = ["src/mcd_gacha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: 需要真实 MCD_MCP_TOKEN 的联网测试（CI 中跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
